name: Release readiness

on:
  schedule:
    - cron: '17 14 * * 1'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release readiness
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          settings="$(xcodebuild \
            -project PaperDrawer.xcodeproj \
            -scheme PaperDrawer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PaperDrawer-Settings" \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings)"
          version="$(awk -F ' = ' '/^[[:space:]]*MARKETING_VERSION = / { print $2; exit }' <<<"$settings")"
          build_number="$(awk -F ' = ' '/^[[:space:]]*CURRENT_PROJECT_VERSION = / { print $2; exit }' <<<"$settings")"
          test -n "$version"
          test -n "$build_number"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build-number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        run: |
          plutil -lint \
            PaperDrawer-Info.plist \
            PaperDrawer/PaperDrawer.entitlements \
            PaperDrawer/PrivacyInfo.xcprivacy \
            app-store/ExportOptions.plist
          sh -n scripts/build_app_store_release.sh

      - name: Build and analyze unsigned Release app
        run: |
          xcodebuild -quiet \
            -project PaperDrawer.xcodeproj \
            -scheme PaperDrawer \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PaperDrawer-Release" \
            CODE_SIGNING_ALLOWED=NO \
            clean build analyze

      - name: Package simulator build
        run: |
          app_path="$RUNNER_TEMP/PaperDrawer-Release/Build/Products/Release-iphonesimulator/PaperDrawer.app"
          test -d "$app_path"
          ditto -c -k --keepParent \
            "$app_path" \
            "$RUNNER_TEMP/PaperDrawer-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build-number }}-unsigned-simulator.zip"

      - name: Upload unsigned build
        uses: actions/upload-artifact@v7
        with:
          name: PaperDrawer-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build-number }}-unsigned-simulator
          path: ${{ runner.temp }}/PaperDrawer-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build-number }}-unsigned-simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Write release summary
        run: |
          echo '## PaperDrawer release readiness' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Version: ${{ steps.version.outputs.version }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Build: ${{ steps.version.outputs.build-number }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Result: unsigned simulator build and static analysis passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Distribution: signed App Store archives must be created on the trusted release Mac' >> "$GITHUB_STEP_SUMMARY"

  source-release:
    name: Source release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish source-only GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "PaperDrawer ${{ needs.build.outputs.version }}"
          fi
